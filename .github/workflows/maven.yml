name: Build, Security & Sonar

on:
  workflow_dispatch:

jobs:

  # =========================================================
  # COMPILE + TEST + SONARQUBE
  # =========================================================

  compile_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test & SonarQube Scan
        run: |
          mvn clean verify sonar:sonar \
          -Dsonar.projectKey=devops-shack-projectops \
          -Dsonar.organization=DevSecOps-Projectss \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload SonarQube Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonar-artifacts
          path: |
            target/classes
            target/site/jacoco/jacoco.xml
            target/surefire-reports

  # =========================================================
  # TRIVY FILESYSTEM
  # =========================================================

  trivy_fs:
    runs-on: ubuntu-latest
    needs: compile_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --offline-scan \
            --exit-code 0 \
            .

  # =========================================================
  # GITLEAKS
  # =========================================================

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install GitLeaks
        run: |
          VERSION=$(curl -s \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -Po '"tag_name": "\K[^"]+')

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz

          sudo tar -xzf gitleaks.tar.gz \
            -C /usr/local/bin \
            gitleaks

          gitleaks version

      - name: GitLeaks Directory Scan
        run: |
          gitleaks dir . \
            --redact \
            --exit-code 0

  # =========================================================
  # SEMGREP
  # =========================================================

  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          python3 -m pip install semgrep

      - name: Semgrep Scan
        run: |
          semgrep scan \
            --config auto \
            .

  # =========================================================
  # CHECKOV
  # =========================================================

  checkov:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Checkov
        run: |
          python3 -m pip install checkov

      - name: Checkov Scan
        run: |
          checkov -d . \
            --soft-fail

  # =========================================================
  # SBOM + GRYPE
  # =========================================================

  sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://get.anchore.io/syft \
            | sudo sh -s -- -b /usr/local/bin

          syft version

      - name: Install Grype
        run: |
          curl -sSfL https://get.anchore.io/grype \
            | sudo sh -s -- -b /usr/local/bin

          grype version

      - name: Generate SBOM
        run: |
          syft dir:. \
            -o cyclonedx-json=sbom.cdx.json

      - name: Scan SBOM With Grype
        run: |
          grype sbom:sbom.cdx.json \
            --only-fixed

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: application-sbom
          path: sbom.cdx.json

  # =========================================================
  # PACKAGE
  # =========================================================

  build:
    runs-on: ubuntu-latest
    needs: 
      - compile_test
      - gitleaks
      - semgrep
      - checkov
      - trivy_fs
      - sbom

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package
        run: mvn package

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/*.jar

  # =========================================================
  # DOCKER BUILD + SCAN + PUSH
  # =========================================================

  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: build

    env:
      IMAGE_REF: ${{ vars.DOCKERHUB_USERNAME }}/docker-project:build-${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push "$IMAGE_REF"
